<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7FD1D8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BIM">
<meta name="description" content="Born in Monge, raccolta contatti da stand.">
<meta name="robots" content="noindex">
<title>Born in Monge</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/montserrat-latin-900-normal.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/montserrat-latin-600-normal.woff2" crossorigin>
<link rel="preload" as="image" href="assets/water.jpg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="scrim" aria-hidden="true"></div>

<main class="app">

  <!-- INTRO -->
  <section class="screen screen--intro is-active" id="s-intro" aria-label="Inizio">
    <img class="logo" src="assets/logo.png" alt="Born in Monge" width="700" height="230">
    <p class="wordmark" hidden>Born in<br>Monge</p>
    <h1 class="title">Accedi<br>all'isola.</h1>
    <button class="btn" type="button" data-go="form">Entra</button>
    <img class="cherry" src="assets/cherry.png" alt="" width="401" height="429" aria-hidden="true">
  </section>

  <!-- FORM -->
  <section class="screen screen--form" id="s-form" aria-label="Dati" hidden>
    <form class="panel" id="lead-form" novalidate autocomplete="on">
      <h2 class="title title--sm">Lascia i tuoi dati</h2>

      <div class="field">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" autocomplete="given-name"
               autocapitalize="words" autocorrect="off" spellcheck="false"
               enterkeyhint="next" maxlength="60" required>
      </div>

      <div class="field">
        <label for="cognome">Cognome</label>
        <input id="cognome" name="cognome" type="text" autocomplete="family-name"
               autocapitalize="words" autocorrect="off" spellcheck="false"
               enterkeyhint="next" maxlength="60" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" inputmode="email"
               autocomplete="email" autocapitalize="off" autocorrect="off"
               spellcheck="false" enterkeyhint="done" maxlength="120" required>
      </div>

      <label class="consent">
        <input id="consenso" name="consenso" type="checkbox" required>
        <span class="consent__box" aria-hidden="true"></span>
        <span class="consent__text">
          Acconsento a ricevere email da Born in Monge.
          <small>Dati usati solo per questo. Ti cancelli quando vuoi.</small>
        </span>
      </label>

      <p class="error" id="form-error" role="alert" hidden></p>

      <button class="btn" type="submit">Avanti</button>
      <button class="link" type="button" data-go="intro">Indietro</button>
    </form>
  </section>

  <!-- ESTRAZIONE -->
  <section class="screen screen--draw" id="s-draw" aria-label="Estrazione" hidden>
    <h2 class="title title--sm" id="draw-title">L'isola decide.</h2>
    <div class="ring" id="ring" role="img" aria-label="Biglie in movimento"></div>
    <p class="hint" id="draw-hint">Tocca per estrarre</p>
  </section>

  <!-- RISULTATO -->
  <section class="screen screen--result" id="s-result" aria-label="Premio" hidden>
    <p class="eyebrow">Hai vinto</p>
    <h2 class="prize">Sconto<br>20%</h2>
    <p class="code" id="code">MONGE20</p>
    <p class="from">Direttamente da Mongerbino</p>
    <button class="btn" type="button" data-go="intro">Avanti il prossimo</button>
  </section>

</main>

<button class="mark" id="mark" type="button" aria-label="Area riservata">BIM</button>

<!-- ADMIN -->
<div class="admin" id="admin" hidden>
  <div class="admin__panel" role="dialog" aria-modal="true" aria-labelledby="admin-title">
    <h2 class="title title--xs" id="admin-title">Contatti</h2>
    <p class="count"><strong id="admin-count">0</strong><span>salvati su questo iPad</span></p>
    <p class="admin__last" id="admin-last"></p>
    <button class="btn btn--sm" type="button" id="admin-csv">Scarica CSV</button>
    <button class="link" type="button" id="admin-wipe">Svuota elenco</button>
    <button class="link" type="button" id="admin-close">Chiudi</button>
  </div>
</div>

<script src="js/water.js"></script>
<script src="js/app.js"></script>
</body>
</html>
